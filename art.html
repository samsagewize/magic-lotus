        <p class="edition-note reveal">Every piece is a 1/1 original, hand-drawn in color pencil on paper.</p>

        <article class="work-item" id="orange">
          <button
            class="work reveal"
            type="button"
            style="--i: 0"
            data-full="/images/untitled-orange.jpg"

                src="/images/untitled-orange-thumb.jpg"
                alt=""
                width="800"
                height="642"
                decoding="async"
              />
            </span>

              <span class="title">Untitled (Orange)</span>
              <span class="edition">1/1 Original</span>
